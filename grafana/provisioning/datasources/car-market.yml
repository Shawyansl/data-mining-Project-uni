apiVersion: 1
datasources:
  - name: Car Market PostgreSQL
    uid: car-market-postgres
    type: postgres
    access: proxy
    url: db:5432
    user: cars_app
    isDefault: true
    editable: false
    secureJsonData:
      password: $CARS_DB_PASSWORD
    jsonData:
      database: car_market
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
